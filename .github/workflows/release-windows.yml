name: Build Windows Release

# 触发：推到 main/master 自动跑；也支持手动 workflow_dispatch 调试。
# 注意：若你的默认分支不是 main/master，请改成实际分支名。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 同分支连推只保留最新一次，取消在途任务，避免重复 CI 占用。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Windows 上 pip 默认缓存不在 ~/.cache/pip，显式绑定让缓存真正生效。
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      PYTHONIOENCODING: utf-8
      # 重要：不写死任何镜像！CI 有正常公网，绝不设置
      #   ELECTRON_MIRROR / ELECTRON_BUILDER_BINARIES_MIRROR / npm_config_registry
      # 那三个仅本机双断网才需要。

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 钉死补丁号，对齐本机 v22.22.2（package.json 无 engines，显式更稳）
          node-version: '22.22.2'
          # 不用官方 npm cache，下方手动 cache ~/.npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # 显式 3.13，对齐本机解释器
          python-version: '3.13'

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements-*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache npm tarballs
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci --prefer-offline

      - name: Create Python venv
        run: python -m venv .venv

      # 显式 shell: cmd —— windows-latest 默认 shell 是 pwsh，跑 .bat 需 cmd。
      # 同一步内先 activate 再 call bat，确保 %VIRTUAL_ENV% 被 bat 探测到。
      - name: Build tdx server
        shell: cmd
        run: call .venv\Scripts\activate.bat && call scripts\build-tdx.bat

      - name: Build sidecar server
        shell: cmd
        run: call .venv\Scripts\activate.bat && call scripts\build-sidecar.bat

      - name: Build Electron app
        run: npm run build:win

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: astock-radar-${{ github.sha }}
          path: |
            dist-electron/*Setup*.exe
            dist-electron/*Portable*.exe
          retention-days: 30

      # 失败时保留日志，便于诊断，不必重跑。
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            __builder*.log
            backend/**/*.log
          retention-days: 7
          if-no-files-found: warn
